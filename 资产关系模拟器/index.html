<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资产关系实验室 · 赛博书房</title><link rel="stylesheet" href="style.css">
<body><header><div class="brand"><span class="logo">⌘</span><div><b>资产关系实验室</b><small>赛博书房 / 独立模拟环境</small></div></div><div class="actions"><span id="saved">仅保存到此浏览器</span><button id="undo" disabled>撤销上一步</button><button id="export">导出 JSON</button><button class="primary" id="create">＋ 新建内容</button></div></header>
<main><aside class="library"><div class="section-title"><b>内容库</b><span id="count"></span></div><div class="search"><input id="search" aria-label="搜索内容" placeholder="搜索标题、类型或标签"><button id="clear" aria-label="清空搜索" hidden>×</button></div><label class="filter">内容类型<select id="filter"></select></label><div id="list"></div><button class="type-add" id="addType">＋ 定义新类型</button><p class="muted">这里的数据独立保存，<br>不会写入赛博书房。</p></aside>
<section class="workspace"><div class="canvas-heading"><div><span class="eyebrow">RELATIONSHIP SANDBOX</span><h1>让内容之间，产生连接。</h1><p>选择一个条目，查看它的上级、下级与关联内容。</p></div><button id="connect">＋ 添加关系</button></div><div class="legend"><span><i class="direct-line"></i> 直属 · 唯一上级</span><span><i class="solid"></i> 包含 · 有方向</span><span><i class="dashed"></i> 关联 · 双向</span><span>点击节点检查字段</span></div><div class="graph-controls"><label>图谱范围 <select id="graphScope"><option value="all">全部内容</option><option value="focus">当前内容与直接连接</option></select></label><div class="zoom-controls"><button id="zoomOut" aria-label="缩小画布">−</button><output id="zoomLabel">100%</output><button id="zoomIn" aria-label="放大画布">＋</button><button id="fit">适应全部</button><button id="resetZoom">100%</button></div></div><div class="graph-scroll"><svg id="graph" viewBox="0 0 900 620" role="img" aria-label="内容关系图"></svg></div><p class="canvas-help">滚轮缩放 · 拖动空白处平移 · 拖动内容块调整位置 · 聚焦节点后用方向键移动</p><div class="canvas-foot"><span id="stats"></span><span>直属限定唯一上级，包含允许多个上级</span></div><section class="relation-panel"><div class="section-title"><b>当前内容的关系</b><span id="selectedTitle"></span></div><div id="relations"></div></section></section>
<aside class="inspector"><div class="section-title"><b>字段检查器</b><span class="live">LIVE</span></div><div id="inspector"></div></aside></main><div id="status" role="status" aria-live="polite"></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><form id="dialogForm" novalidate><div class="section-title"><h2 id="dialogTitle"></h2><button type="button" id="close" aria-label="关闭">×</button></div><div id="dialogBody"></div><p id="error" role="alert"></p><div class="dialog-actions"><button type="button" id="cancel">取消</button><button type="submit" class="primary">保存</button></div></form></dialog><script src="shared/contentSchema.js"></script><script src="model.js"></script><script src="app.js"></script></body></html>
