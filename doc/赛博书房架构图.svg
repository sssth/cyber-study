<title id="title">赛博书房｜系统架构</title><desc id="desc">场景包连接功能区，各功能区产生的实体汇入个人知识库。用户搜索和筛选实体后，可生成 AI 快照、查看地球仪和探索实体关联。场景包、功能区与实体、搜索与筛选和结果应用均可由用户自定义扩展。</desc>
